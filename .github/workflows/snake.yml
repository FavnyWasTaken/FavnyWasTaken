name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3a3a3a&color_dots=#ebebeb,#c8c8c8,#9e9e9e,#737373,#4a4a4a&color_dot_border=#d9d9d9
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e6e6e6&color_dots=#1c1c1c,#3a3a3a,#5c5c5c,#8a8a8a,#c8c8c8&color_dot_border=#2a2a2a

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
